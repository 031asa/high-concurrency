[product]
id = "ydtrader-high-concurrency"
executable = "ydtrader"
python_package = "ydcore"
entrypoint = "main.py"

[paths]
install_root = "/opt/ydtrader"
state_root = "/var/lib/ydtrader"

[protection]
protected_modules = ["launcher", "marketdata", "monitoring", "trading", "yd_redis_server", "runtime_diagnostics", "archive_analysis", "version_info"]
nuitka_include_modules = [
  "pyyd",
  "ydcore.launcher",
  "ydcore.marketdata",
  "ydcore.monitoring",
  "ydcore.trading",
  "ydcore.yd_redis_server",
  "ydcore.runtime_diagnostics",
  "ydcore.archive_analysis",
  "ydcore.version_info",
  "scripts.time_probe",
  "aeron_mvp.ctp_bridge",
  "aeron_mvp.ctp_cli",
  "aeron_mvp.market_wire",
  "aeron_mvp.multi_source_mux",
  "aeron_mvp.source_config",
  "aeron_mvp.synthetic_bridge",
  "aeron_mvp.ydapi_bridge",
  "aeron_mvp.zmq_market_probe",
  "dashboard.server",
  "dashboard.replay",
]
nuitka_include_packages = ["redis", "timer_pdf", "reportlab", "pypdf"]

[protection.packages]
aeron_mvp = [
  "ctp_bridge",
  "ctp_cli",
  "market_wire",
  "multi_source_mux",
  "source_config",
  "synthetic_bridge",
  "ydapi_bridge",
  "zmq_market_probe",
]
dashboard = ["server", "replay"]
scripts = ["time_probe"]
"timer_pdf.code" = ["analysis", "main", "publication", "render", "rules"]

[container]
base_image = "ubuntu:24.04"
builder_image = "secure-release-builder-cn:24.7.1"
runtime_packages = ["ca-certificates", "fonts-wqy-microhei"]
uid = 10001

[build]
environment_file = "environment.yml"
prepare_commands = [["bash", "scripts/prepare_secure_release.sh"]]
exclude_paths = [
  "scripts/install_time_probe_service.py",
  "timer_pdf/code/install_timer.py",
  "timer_pdf/pdf",
  "scripts/analyze_archive.py",
  "scripts/yd_redis_server.py",
  "build_tools",
  "scripts/prepare_secure_release.sh",
  "aeron_mvp/bootstrap.sh",
  "aeron_mvp/build.sh",
  "aeron_mvp/build_release.sh",
  "aeron_mvp/src",
  "aeron_mvp/schema",
  "aeron_mvp/build/generated",
]

[validation]
args = ["--help"]
expected_exit_code = 0

[licensing]
features = ["market-service"]
